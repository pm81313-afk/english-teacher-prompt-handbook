<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>英文教師提示詞手冊</title><style>
:root{--ink:#263d3d;--muted:#687b78;--green:#335f58;--cream:#f7f5ef;--line:#dfe6df;--peach:#f4dfcb}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;line-height:1.7}header{background:#e9f0e8;border-bottom:1px solid var(--line)}.wrap{max-width:1200px;margin:auto;padding:0 28px}.top{display:flex;justify-content:space-between;align-items:center;padding-top:24px;font-size:13px;letter-spacing:.12em;font-weight:700}.brand{display:flex;gap:10px;align-items:center}.mark{background:var(--green);color:white;border-radius:9px;padding:2px 10px;font-size:15px}.hero{padding:50px 0 45px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}.eyebrow{color:#9b6b4b;font-weight:700;font-size:13px;letter-spacing:.16em}h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,53px);letter-spacing:.03em;margin:8px 0 8px;line-height:1.25}.hero p{color:#5e716d;margin:0;max-width:650px}.stat{border-left:1px solid #bbcbc1;padding-left:26px;color:var(--green);font-size:13px}.stat strong{display:block;font-family:Georgia;font-size:42px;line-height:1}.layout{display:grid;grid-template-columns:220px 1fr;gap:42px;padding-top:42px;padding-bottom:80px}.sidebar{position:sticky;top:24px;align-self:start}.label{font-size:12px;color:#83918c;letter-spacing:.12em;font-weight:700;margin:0 0 12px}.filter{border:0;background:transparent;text-align:left;width:100%;padding:10px 12px;border-radius:8px;color:#596d68;font:inherit;cursor:pointer}.filter.active{background:#dae8de;color:#264f46;font-weight:700}.filter:hover{background:#e6eee7}.tip{margin-top:32px;border-top:1px solid var(--line);padding-top:20px;color:#7d8c86;font-size:13px}.bar{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.bar h2{margin:0;font-size:25px}.bar p{margin:0;color:var(--muted);font-size:14px}.search{width:min(310px,100%);padding:12px 15px;border:1px solid #d3dfd6;border-radius:9px;background:white;font:inherit;outline-color:var(--green)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;min-height:230px;box-shadow:0 5px 20px #284c3b08}.meta{display:flex;justify-content:space-between;align-items:center;color:#9ca9a1;font-size:12px;letter-spacing:.08em}.tag{background:#eef4ee;color:#64816d;border-radius:20px;padding:3px 10px;letter-spacing:0}.card h3{font-size:20px;margin:16px 0 5px}.card p{font-size:14px;color:var(--muted);margin:0 0 20px}.actions{display:flex;gap:10px;margin-top:auto}button{font:inherit}.btn{border:1px solid #d8e4db;background:white;color:var(--green);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:650}.primary{background:var(--green);color:white;border-color:var(--green)}.btn:hover{filter:brightness(.94)}.empty{padding:45px 10px;color:var(--muted)}dialog{border:0;border-radius:16px;padding:0;width:min(760px,calc(100% - 28px));max-height:85vh;box-shadow:0 20px 90px #0004}dialog::backdrop{background:#172c27aa}.modalhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:22px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px}.modalhead h2{font-size:20px;margin:0}.close{font-size:24px;background:none;border:0;cursor:pointer;color:#617970}.modalbody{padding:25px}.prompt{white-space:pre-wrap;background:#f6f8f4;border:1px solid var(--line);padding:20px;border-radius:10px;line-height:1.9;font-size:15px}.modalfoot{position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding:15px 25px;display:flex;justify-content:space-between;align-items:center;gap:10px}.modalfoot span{font-size:13px;color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#244d43;color:white;padding:10px 18px;border-radius:8px;z-index:5}.hidden{display:none}@media(max-width:760px){.wrap{padding:0 20px}.hero{padding:36px 0}.stat{display:none}.layout{display:block;padding-top:25px}.sidebar{position:static}.filters{display:flex;gap:5px;overflow:auto;margin-bottom:24px}.filter{white-space:nowrap;width:auto}.tip,.sidebar .label{display:none}.bar{align-items:stretch;flex-direction:column}.search{width:100%}.cards{grid-template-columns:1fr}.card{min-height:190px}.top .right{display:none}} </style></head><body><header><div class="wrap"><div class="top"><div class="brand"><span class="mark">Aa</span> TEACHER’S PROMPT LIBRARY</div><span class="right">為教學靈感留一點空間</span></div><div class="hero"><div><div class="eyebrow">A LITTLE HELP FOR TEACHERS</div><h1>英文教師提示詞手冊</h1><p>從備課、課堂管理到國際交流，找到適合的提示詞，複製後依教學需求調整，即可開始使用。</p></div><div class="stat"><strong>12</strong>實用提示詞</div></div></div></header><main class="wrap layout"><aside class="sidebar"><div class="label">依用途瀏覽</div><nav class="filters" aria-label="提示詞分類"></nav><div class="tip">使用小提醒<br>提示詞中的［ ］可替換為你的課程資訊。涉及課文或校務資料時，記得先提供相關資料。</div></aside><section><div class="bar"><div><h2 id="section-title">全部提示詞</h2><p id="count"></p></div><input class="search" type="search" placeholder="搜尋主題或關鍵字…" aria-label="搜尋提示詞"></div><div class="cards" id="cards"></div><p id="empty" class="empty hidden">找不到符合的提示詞，試試其他關鍵字。</p></section></main><dialog id="dialog" aria-labelledby="dialog-title"><div class="modalhead"><h2 id="dialog-title"></h2><button class="close" aria-label="關閉">×</button></div><div class="modalbody"><div class="prompt" id="prompt"></div></div><div class="modalfoot"><span>可直接複製，也可以依需求修改。</span><button class="btn primary" id="modal-copy">複製提示詞</button></div></dialog><div class="toast hidden" role="status" aria-live="polite"></div><script>
const items=[{"id": 1, "title": "4C 與 SDGs 英文學習單", "desc": "以永續交通為主題，結合英文閱讀、討論及表達。", "cat": "教學與教材", "prompt": "你是一位臺灣高中英文教師。請為高二學生設計一份「Sustainable Transportation and City Life（永續交通與城市生活）」英文學習單，結合聯合國永續發展目標（SDGs）與 4C：批判性思考、溝通、合作、創意。課程時間為一節 50 分鐘，英文難度以 CEFR B1 左右為參考。\n\n請依下列順序設計：\n1. 學習目標：涵蓋主題理解、英文溝通及合作。\n2. 課前引導：以學生通勤經驗提出暖身問題。\n3. 語言輸入：提供 8 個核心字詞、中文意思與簡短例句，以及一篇原創、適合學生程度的英文短文。\n4. 引導練習：設計閱讀理解與資料判讀題。\n5. 合作學習：讓學生以英文討論不同交通方式的優缺點，提出改善通勤的建議。\n6. 個人練習與反思：提供句型鷹架，讓學生寫出一項具體行動。\n7. 評量：列出可觀察的成功準則。\n\n請將學生版與教師版分開，教師版附參考答案、解析與活動時間分配。推薦一支與主題相關的 YouTube 影片，並設計一個思考問題；若引用資料，請提供資料名稱、日期及可直接開啟的來源網址，實際核對連結與標題。無法查證時請明確標示，勿編造來源或網址。"}, {"id": 2, "title": "英文遊戲式學習互動網頁", "desc": "先規劃英文互動學習工具，再依需要進行開發。", "cat": "教學與教材", "prompt": "你是一位高中英文教師兼教育遊戲設計師。請以「Plan a Sustainable City Trip（規劃一趟永續城市旅行）」為主題，為高二學生規劃一個英文遊戲式學習網頁，英文難度以 CEFR B1 左右為參考。\n\n學生將閱讀簡短英文資訊、比較交通選項，與同儕討論並提出旅行方案。請結合 4C，安排以下歷程：自主探索 → 統整歸納 → 回饋反思 → 提出方案。提供核心字彙、英文句型、示範回答、遊戲任務、回饋方式及教師使用建議，並說明如何觀察學生的英文溝通與合作表現。\n\n請先列出學習目標、頁面架構、每個頁面的互動流程、資料需求、HTML/CSS/JavaScript 開發步驟及測試重點；目前先不要開發網頁。若需使用真實地點或交通資訊，請以我提供的資料為準，未提供處標示為示例。"}, {"id": 3, "title": "英文課文導讀與組織圖配對", "desc": "將教師提供的課文與講解資料轉換為自學網頁。", "cat": "教學與教材", "prompt": "你是一位高中英文教師及互動教材設計師。請根據我提供的英文課文、單字表及文法講解檔案，為臺灣高中生設計一個方便自學的互動網頁，包含：\n1. 單字閃卡：單字、詞性、中文意思、例句與朗讀功能。\n2. 課文分段：按段呈現教材文字，提供分段朗讀操作；若教材含詩作，也請納入。\n3. 段落大意：提供每段摘要、關鍵訊息及閱讀理解問題。\n4. 點選句子解析：顯示教材中相應的字彙、文法與句型說明。\n5. 課文組織圖配對：讓學生將段落與大意配對，提供即時回饋及重試功能。\n6. 學習支持：提供必要的中文提示、句型鷹架和一個示範回答。\n\n請依我提供的材料製作，內容不足時列出待補資料，不要自行杜撰課文或教材解釋。先提供頁面與互動設計，再依提供的材料完成可操作的 HTML、CSS 與 JavaScript 網頁，並讓我預覽。"}, {"id": 4, "title": "英文教學簡報", "desc": "將教師提供的教材轉化為可教學的簡報。", "cat": "教學與教材", "prompt": "請根據我提供的英文課文與教學目標，為臺灣高二學生製作一份 50 分鐘的 Google 簡報，主題為「[填入課文或單元主題]」，英文難度以 CEFR B1 左右為參考。\n\n請依教學順序安排：學習目標、生活情境暖身、核心字彙與句型、課文輸入、引導練習、雙人或小組溝通任務、個人練習、課末反思與學習檢核。提供英文句型鷹架及簡短示範回答，每頁標示教學重點與建議活動時間，活動時間加總為 50 分鐘。\n\n版面請考量多媒體學習與認知負荷，使用清楚的視覺層次；內文字體以 32 pt 為原則，內邊距保留 10%，配色與圖片依主題搭配。若無法直接建立 Google 簡報，請先提供可複製的逐頁內容與版面建議。未提供的教材資訊請標示待補。"}, {"id": 5, "title": "英文課點名系統", "desc": "記錄英文課的出缺席並匯出結果。", "cat": "課堂管理", "prompt": "請設計一個英文教師上課點名紀錄網頁，使用 HTML、CSS 和 JavaScript，介面以繁體中文為主。頁面上方可填寫或選擇日期、節次、班級、科目（預設英文）與教師姓名。\n\n請提供座號起點、終點及排除座號欄位，並支援上傳學生名單 CSV。以清楚的座號方格進行點名，點選後可切換出席與缺席狀態並以顏色區分；即時顯示缺席座號、出席人數與班級總人數。提供下載點名結果的功能，並顯示日期與課程資料。請使用馬卡龍配色、大字體和易於操作的版面，並提供可預覽的完整網頁。"}, {"id": 6, "title": "英文作業繳交系統", "desc": "追蹤英文作業的繳交狀態。", "cat": "課堂管理", "prompt": "請設計一個英文作業繳交紀錄網頁，使用 HTML、CSS 和 JavaScript，介面以繁體中文為主。頁面上方可填寫日期、班級、教師姓名與作業名稱，科目預設為英文；作業名稱可填入 English Reading Journal、Vocabulary Practice 等。\n\n請提供座號起點、終點及排除座號欄位，支援上傳學生名單 CSV。以座號方格呈現學生，教師可為每位學生設定「已繳交、遲交、未繳交」，用不同顏色與文字清楚區分。即時顯示各狀態的人數與座號，並提供下載紀錄功能。使用馬卡龍配色、大字體和容易操作的版面，並提供可預覽的完整網頁。"}, {"id": 7, "title": "英文考試倒數日曆", "desc": "提醒學生距離英文考試的時間。", "cat": "課堂管理", "prompt": "請設計一個適合英文教室使用的「English Exam Countdown（英文考試倒數）」互動網頁，使用 HTML、CSS 和 JavaScript。畫面以醒目大字呈現倒數日數，並提供「考試名稱」輸入欄與「考試日期」日期選擇器。\n\n選擇日期後，立即顯示距離考試的天數；考試當天顯示「Today is the day!」，日期已過時顯示「考試日期已過」，未選日期時顯示操作提示。加入一句簡短鼓勵語，採用清楚、舒適的版面並支援手機。請提供完整網頁與可供檢視的預覽。"}, {"id": 8, "title": "英文心情天氣網頁", "desc": "讓學生以簡單英文表達當下心情，並觀察班級整體狀態。", "cat": "班級經營", "prompt": "請設計一個適合高中英文課暖身的「My Emotional Weather」互動網頁，使用 HTML、CSS 和 JavaScript。提供 5 至 10 種天氣圖示及簡單英文心情詞，例如 sunny、cloudy、rainy；學生可點選最符合當下心情的選項，網頁即時統計各選項的人數。\n\n每種天氣搭配一句簡短、溫暖的英文心情小語，並提供句型 “Today I feel ___ because ___.” 與一個示範回答。學生可以自願分享，也可以不說明原因；介面提供必要的中文輔助。請使用舒適配色、大字體及適合手機的版面，提供可預覽的完整網頁。若資料只在目前裝置上統計，請在畫面清楚說明；不要假設不同裝置的資料會自動同步。"}, {"id": 9, "title": "校務願景講稿與簡報", "desc": "校長向家長代表說明新學年度願景。", "cat": "校務與交流", "prompt": "你是一位熟悉臺灣學校與國際教育的演說教練。請根據我提供的學校資料，為校長撰寫一份面向國際訪客的 10 分鐘英文學校介紹講稿與簡報腳本，英文程度以清楚易懂為原則。\n\n內容包括學校願景、英文與雙語教育、學生多元學習成果、國際交流及未來合作方向。請以雙欄呈現：左欄為自然、親切的英文演講逐字稿；右欄為對應投影片標題、關鍵視覺或圖表建議、講者停頓提示。另附重要詞彙的中英對照及一段簡短問答示範。沒有提供的數據與成果請標示「待補資料」，不要編造。"}, {"id": 10, "title": "校務願景與特色成果互動儀表板", "desc": "展示學校願景、特色數據、SDGs 實踐與發展里程碑。", "cat": "校務與交流", "prompt": "你是一位教育科技網頁開發者。請使用 HTML、CSS 和 JavaScript，設計「English and Bilingual Learning Showcase（英文與雙語學習成果展示）」互動網頁，供家長與國際訪客瀏覽，採用深藍與象牙白的簡潔風格，並支援中英文切換。\n\n網頁包含：學校英文與雙語教育願景、三張學習目標卡片、學生作品或課程成果展示、國際交流活動、與 SDGs 相關的英語學習活動，以及近三年的發展時間軸。資料以我提供的內容為準；未提供的數字、作品或活動請清楚標示為「待補資料」，不要虛構。請提供完整網頁、手機版排版及可供檢視的預覽。"}, {"id": 11, "title": "Vocabulary Master 互動式學習工具", "desc": "建立單字卡、四種練習遊戲與學習進度報告。", "cat": "教學與教材", "prompt": "請幫我建立一個單一檔案的 HTML 網頁應用程式 (Single-file HTML)，名稱為「Vocabulary Master 互動式學習工具」。\n\n【技術與環境要求】\n\n1. 單一檔案：所有的 HTML、自定義 CSS 和 JavaScript (使用 ES6 模組) 都必須寫在同一個 .html 檔案中。\n2. 樣式與 UI：使用 Tailwind CSS (透過 CDN https://cdn.tailwindcss.com 引入)。UI 需具備現代感，包含漸層文字、陰影 (shadow-lg)、圓角 (rounded-2xl) 與過渡動畫 (hover:scale 等)。\n3. 圖示：使用 Phosphor Icons (透過 CDN https://unpkg.com/@phosphor-icons/web 引入)。\n4. Firebase 整合 (v11 模組化寫法)：\n* 需實作 Firebase 匿名登入 (signInAnonymously) 或自定義 Token 登入 (signInWithCustomToken)。\n* 必須從全域變數讀取 __firebase_config 和 __app_id 作為環境設定。\n* 使用 Firestore 儲存使用者的學習進度，資料寫入與讀取的路徑必須嚴格為：artifacts/${appId}/users/${userId}/vocabulary。\n* 絕不使用 alert()，所有錯誤或提示請直接顯示在畫面上。\n\n【核心資料與機制】\n\n1. 單字庫：內建大約 15 個進階英文單字。每個單字物件需包含：en (英文)、zh (中文)、usage (常見用法)、collocation (搭配詞)、sentence (例句)、sentence_zh (例句中文)。\n2. 語音朗讀 (TTS)：實作一個 JavaScript 函式，利用瀏覽器內建的 window.speechSynthesis 來朗讀英文單字與例句。\n3. 進度追蹤機制：當在練習模式答題後，更新 Firestore 中的數據 (紀錄 correct, incorrect 次數)。若答對次數 >= 3 且大於答錯次數，狀態設為 'mastered' (已掌握)，否則為 'learning' (學習中)。\n\n【版面配置與三大模式】\n\n畫面頂部需要有漸層標題、顯示 Firebase 學習 ID，以及三個導覽按鈕 (學習單字、開始練習、學習報告) 來切換以下模式。內容區塊切換時請加入簡單的淡入 (fade-in) 動畫。\n\n1. 學習單字 (Learning Mode)\n- 以精美的「單字卡 (Flashcard)」形式呈現。每次切換單字時，卡片背景顏色要在幾個柔和的顏色中隨機變換 (如藍色、綠色、黃色等 Tailwind 顏色 100 級距)。\n- 單字旁要有「發音按鈕」，點擊可朗讀單字。點擊例句區塊也可以朗讀例句。\n- 下方提供「上一個」與「下一個」按鈕來切換單字。\n\n2. 開始練習 (Practice Mode)\n首先顯示一個 4 宮格選單，包含四種測驗遊戲。每個遊戲答題後需給予「正確/錯誤」的視覺回饋、自動更新 Firebase，並在短暫延遲後自動跳下一題。每個遊戲介面都要有「返回選單」按鈕。\n- 單字選義：上方顯示英文單字，下方提供四個中文選項按鈕。\n- 克漏字：顯示一句挖空目標單字的例句 (例如把單字替換成 ______)，提供四個英文選項填空。\n- 單字配對：畫面左右分為兩側，左側隨機 5 個英文單字，右側隨機 5 個對應的中文意思。點選左右進行配對，配對成功則按鈕變綠並劃線禁用。\n- 拼字練習：提供一個大大的「播放發音」按鈕，使用者聽完後在 <input> 輸入英文單字並送出。\n\n3. 學習報告 (Report Mode)\n- 顯示個人的學習數據儀表板 (Dashboard)。\n- 上方以大數字顯示三個統計卡片：「已掌握」、「學習中」、「未學習」的數量。\n- 中間放置一個視覺化的進度條 (Progress Bar)，顯示已掌握單字的百分比。\n- 下方用網格 (Grid) 條列出所有單字，並根據其狀態 (未開始/學習中/已掌握) 顯示不同的背景顏色與對應的 Phosphor Icon。"}, {"id": 12, "title": "教師 AI 應用即時調查", "desc": "蒐集教師身分、AI 使用需求與頻率，即時呈現多人投票結果。", "cat": "校務與交流", "prompt": "幫我製作一個即時調查的互動介面。\n\n左側畫面中要有以下幾個選項：\n\n1. 老師您在校內的主要身分（行政、導師、專任）\n2. 希望使用 AI 應用於何處（行政、班級經營、教學）\n3. 目前使用 AI 的頻率\n4. 教授哪一個科目（手動輸入）\n\n右側畫面即時出現投票結果。\n\n這個專案需要多人共享／跨工作階段儲存資料（例如：多人留言板、雲端排行榜、共享待辦清單），請幫我整合雲端資料庫儲存功能。"}];let category='全部',query='',current=null;const cards=document.querySelector('#cards'), filters=document.querySelector('.filters'), dialog=document.querySelector('#dialog');
function toast(s){const el=document.querySelector('.toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(window.t);window.t=setTimeout(()=>el.classList.add('hidden'),2200)}
async function copy(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();if(!document.execCommand('copy'))throw Error();a.remove()}toast('已複製提示詞')}catch(e){toast('複製失敗，請開啟全文後手動選取複製')}}
function render(){filters.replaceChildren();['全部','教學與教材','課堂管理','班級經營','校務與交流'].forEach(c=>{let b=document.createElement('button');b.className='filter'+(category===c?' active':'');b.textContent=c;b.setAttribute('aria-pressed',category===c);b.onclick=()=>{category=c;render()};filters.append(b)});let list=items.filter(i=>(category==='全部'||i.cat===category)&&[i.title,i.desc,i.prompt,i.cat].join(' ').toLowerCase().includes(query));document.querySelector('#section-title').textContent=category==='全部'?'全部提示詞':category;document.querySelector('#count').textContent=`顯示 ${list.length} 個提示詞`;document.querySelector('#empty').classList.toggle('hidden',!!list.length);cards.replaceChildren();list.forEach(i=>{let card=document.createElement('article');card.className='card';let meta=document.createElement('div');meta.className='meta';let tag=document.createElement('span');tag.className='tag';tag.textContent=i.cat;let num=document.createElement('span');num.textContent=String(i.id).padStart(2,'0');meta.append(tag,num);let h=document.createElement('h3');h.textContent=i.title;let p=document.createElement('p');p.textContent=i.desc;let actions=document.createElement('div');actions.className='actions';let view=document.createElement('button');view.className='btn';view.textContent='查看全文';view.onclick=()=>{current=i;document.querySelector('#dialog-title').textContent=i.title;document.querySelector('#prompt').textContent=i.prompt;dialog.showModal()};let cp=document.createElement('button');cp.className='btn primary';cp.textContent='複製提示詞';cp.setAttribute('aria-label','複製'+i.title+'提示詞');cp.onclick=()=>copy(i.prompt);actions.append(view,cp);card.append(meta,h,p,actions);cards.append(card)})}
document.querySelector('.search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});document.querySelector('.close').onclick=()=>dialog.close();document.querySelector('#modal-copy').onclick=()=>copy(current.prompt);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});render();</script></body></html>
